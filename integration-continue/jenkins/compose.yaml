name: souverainrecrut-ci

services:
  sonarqube:
    image: sonarqube:26.10.0.133078-community@sha256:f95aaa9016dd4e92c7d70691167a6d96dbb5d8acffd61eba1cb4335d364a7840
    ports:
      - "127.0.0.1:19000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions

  docker:
    image: docker:29-dind@sha256:08a98015fce594af7c382883bea080ea206de74402a95da9dc52b6428c8cd121
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - docker-data:/var/lib/docker
      - docker-certs:/certs/client

  jenkins:
    build: .
    depends_on:
      - docker
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc.yaml
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    secrets:
      - jenkins_password
      - sonar_token
    volumes:
      - jenkins-data:/var/jenkins_home
      - docker-certs:/certs/client:ro

secrets:
  jenkins_password:
    file: .state/jenkins_password
  sonar_token:
    file: .state/sonar_token

volumes:
  docker-data:
  docker-certs:
  jenkins-data:
  sonar-data:
  sonar-extensions:
