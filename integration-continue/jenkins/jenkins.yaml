jenkins:
  numExecutors: 1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "tp-admin"
          password: "${jenkins_password}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: sonar-token
              secret: "${sonar_token}"
unclassified:
  location:
    url: "http://127.0.0.1:18080/"
  sonarGlobalConfiguration:
    installations:
      - name: SonarQube
        serverUrl: "http://sonarqube:9000"
        credentialsId: sonar-token
jobs:
  - script: |
      pipelineJob('souverainrecrut-Dev') {
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/Antoine-Ferron/souverainrecrut.git') }
                branch('*/Dev')
              }
            }
            scriptPath('integration-continue/Jenkinsfile')
            lightweight(true)
          }
        }
      }
